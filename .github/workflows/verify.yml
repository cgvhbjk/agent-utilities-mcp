name: Verify MCP adapter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: sha256sum -c agent-utilities-mcp.mjs.sha256
      - run: node verify.mjs
      - run: docker build -t agent-utilities-mcp .
      - run: node verify.mjs --docker
