name: Verify MCP adapter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: sha256sum -c agent-utilities-mcp.mjs.sha256
      - run: node verify.mjs
      - run: node verify-cursor.mjs
      - run: node verify-vscode.mjs
      - run: node verify-examples.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s examples/python -p 'test_*.py'
      - run: cd examples/python && sha256sum -c agent_utilities.py.sha256 && sha256sum -c agent_utilities_example.py.sha256 && sha256sum -c pack_plan_example.py.sha256 && sha256sum -c pack_plan_cases.json.sha256 && python agent_utilities_example.py && python pack_plan_example.py
      - run: docker build -t agent-utilities-mcp .
      - run: node verify.mjs --docker
