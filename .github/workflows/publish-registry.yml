name: Publish reviewed release to MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public release artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_url=$(jq -r '.packages[0].identifier' server.json)
          artifact_hash=$(jq -r '.packages[0].fileSha256' server.json)
          curl --fail --location --proto '=https' --tlsv1.2 "$artifact_url" --output release.mcpb
          printf '%s  release.mcpb\n' "$artifact_hash" | sha256sum --check
      - name: Install pinned official publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz --output publisher.tar.gz
          printf '%s  publisher.tar.gz\n' a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - name: Authenticate with short-lived GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Publish the checked server metadata
        run: ./mcp-publisher publish
